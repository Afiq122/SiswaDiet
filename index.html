function elig(P){const out=[],rej={},al=P.al.filter(a=>a!='none'&&a!='skip');
 ML.forEach(m=>{let r=0;if(m.lv>DL[P.diet])r='diet';else if(m.al.some(a=>al.includes(a)))r='allergen';else if(m.unk&&P.al.some(a=>a!='none'))r='unknown';else if(P.dl.some(x=>m.ing.includes(x)))r='dislike';r?rej[m.id]=r:out.push(m)});return{out,rej}}
function targets(P){const w=P.w||60,h=P.h||165,g=P.goal,ad=(P.age||20)>=18,t=Math.round((10*w+6.25*h-5*(P.age||20)-78)*(ACT[P.act]||1.375));

 return{tdee:t,kLo:Math.max(g=='light'?1200:1100,Math.round(t*lo)),kHi:Math.round(t*hi),pro:Math.round(w*pk*.9)}}
function combos(p){const sn=[{m:[],rm:0,k:0,p:0}];p.s.forEach((x,i)=>{sn.push({m:[x],rm:x.rm,k:x.k,p:x.p});for(let j=i+1;j<p.s.length;j++){const y=p.s[j];sn.push({m:[x,y],rm:x.rm+y.rm,k:x.k+y.k,p:x.p+y.p})}});
 const o=[];for(const b of p.b)for(const l of p.ld)for(const d of p.ld){if(l==d)continue;for(const s of sn)o.push({m:[b,l,d,...s.m],rm:+(b.rm+l.rm+d.rm+s.rm).toFixed(2),k:b.k+l.k+d.k+s.k,p:b.p+l.p+d.p+s.p})}return o}
function analyse(P){const{out,rej}=elig(P),T=targets(P),p={b:out.filter(m=>m.c=='b'),ld:out.filter(m=>m.c=='ld'),s:out.filter(m=>m.c=='s')};
 if(!p.b.length||p.ld.length<2)return{out,rej,T,none:1,cs:[],good:[]};
 const cs=combos(p),good=cs.filter(c=>c.k>=T.kLo&&c.k<=T.kHi&&c.p>=T.pro),c5=x=>Math.ceil(x*2)/2,minAny=cs.reduce((a,c)=>Math.min(a,c.rm),99);
 const gs=[...good].sort((a,b)=>a.rm-b.rm),seen=new Set();let rec=null;for(const c of gs){c.m.forEach(m=>seen.add(m.id));if(seen.size>=12){rec=c.rm;break}}
 return{out,rej,T,cs,good,minAny,minGoal:gs.length?gs[0].rm:null,sg:gs.length?[c5(gs[0].rm),c5(rec??gs[gs.length-1].rm)]:null}}
const score=(c,T,b)=>Math.min(c.p/T.pro,1.15)*50+(1-Math.min(1,Math.abs(c.k-(T.kLo+T.kHi)/2)/T.kHi))*30+(b-c.rm)/b*10;
function build(P){const a=analyse(P);A=a;const rj={};Object.values(a.rej).forEach(r=>rj[r]=(rj[r]||0)+1);
 const tr={all:ML.length,ok:a.out.length,rej:rj,T:a.T,n:a.cs.length,minAny:a.minAny,minGoal:a.minGoal,sg:a.sg,fit:0};
 if(a.none)return{mode:'none',tr,why:'pool'};
 let pool=a.good.filter(c=>c.rm<=P.bud),mode='full';if(!pool.length){pool=a.cs.filter(c=>c.rm<=P.bud);mode='partial'}
 tr.fit=pool.length;if(!pool.length)return{mode:'none',tr,why:'budget'};
 const used={},days=[];for(let d=0;d<7;d++){let best,bs=-1e9;for(const c of pool){let s=score(c,a.T,P.bud);c.m.forEach(m=>s-=14*(used[m.id]||0));if(s>bs){bs=s;best=c}}
  best.m.forEach(m=>used[m.id]=(used[m.id]||0)+1);days.push(best.m.map(m=>m.id))}
 return{mode,days,tr,P:JSON.parse(JSON.stringify(P))}}

const blob=b=>URL.createObjectURL(new Blob([Uint8Array.from(atob(b),c=>c.charCodeAt(0))],{type:'image/webp'}));
const SPR={};Object.keys(RAW).forEach(k=>{SPR[k]=blob(RAW[k]);new Image().src=SPR[k]});const LOGO=blob(LOGO_RAW);
const MAP={wave:'hero',sleep:'rest',thinking:'work',meal:'meal',budget:'budget',celebrate:'goal',empty:'think',plan:'plan',muscle:'muscle',load:'load'};
const ALT={hero:'Sisi giving a thumbs up',rest:'Sisi resting',work:'Sisi working on a laptop',meal:'Sisi enjoying a meal',budget:'Sisi holding a wallet',goal:'Sisi celebrating',think:'Sisi thinking',plan:'Sisi holding your plan',muscle:'Sisi lifting a dumbbell',load:'Sisi walking'};
const EX={goal:'<b class="cf a"></b><b class="cf b"></b><b class="cf c"></b><b class="cf d"></b>',budget:'<b class="st a"></b><b class="st b"></b>',meal:'<b class="ht">♥</b>',work:'<i></i><i></i><i></i>'};
function sisi(v='wave',s=110){const k=MAP[v]||v,h=k=='hero'?Math.round(s*1.15):s;
 if(k=='load')return`<div class="sp sp-load" style="width:${Math.round(h*.8)}px;height:${h}px" role="img" aria-label="${ALT.load}">${['front','side','back'].map(x=>`<img src="${SPR[x]}" alt="">`).join('')}</div>`;
 return`<div class="sp sp-${k}" style="height:${h}px" data-a="hop" role="img" aria-label="${ALT[k]||'Sisi'}"><img src="${SPR[k]}" alt="" draggable="false">${EX[k]||''}</div>`}
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',plan:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>',explore:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',prog:'<path d="M5 20V11M12 20V4M19 20v-6"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',ok:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',bowl:'<path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const th=m=>`<div class="th" style="background:${{b:'var(--yw)',ld:'var(--lav)',s:'var(--mw)'}[m.c]};color:${{b:'#B7791F',ld:'var(--pri)',s:'var(--mt)'}[m.c]}">${ic('bowl',26)}</div>`;

/* ===== FORM HELPERS ===== */
const er=k=>errs[k]?`<p class="er" role="alert">${esc(errs[k])}</p>`:'';
const fld=(k,l,v,a='')=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" data-k="${k}" value="${esc(v)}" ${a}>${er(k)}</div>`;
const sel=(k,o)=>`<div class="f"><label for="${k}">${o[0]}</label><select id="${k}" data-k="${k}">${o[1].map(([v,t])=>`<option value="${v}" ${(S.P[k]||'')==v?'selected':''}>${t}</option>`).join('')}</select></div>`;
const card=(k,v,t,s,d)=>`<button type="button" class="oc ${S.P[k]==v?'on':''}" data-a="pick" data-k="${k}" data-v="${v}" aria-pressed="${S.P[k]==v}" ${d?'disabled':''}><b>${t}</b>${s?`<small>${s}</small>`:''}</button>`;
const chS=(k,v,t)=>`<button type="button" class="ch ${S.P[k]==v?'on':''}" data-a="pick" data-k="${k}" data-v="${v}" aria-pressed="${S.P[k]==v}">${t}</button>`;
const chM=(k,v,t)=>`<button type="button" class="ch ${S.P[k].includes(v)?'on':''}" data-a="tog" data-k="${k}" data-v="${v}" aria-pressed="${S.P[k].includes(v)}">${t}</button>`;
function tog(k,v){let a=S.P[k];const ex=['none','skip'];a=a.includes(v)?a.filter(x=>x!=v):ex.includes(v)&&(k=='al'||k=='hn')?[v]:[...a.filter(x=>!(k=='al'||k=='hn')||!ex.includes(x)),v];S.P[k]=a}

const SV=['wave','plan','empty','meal','budget'],TIP=['Hi! Tell me a little about you.','Your routine helps me match your day.','Safety first. I skip anything unsafe for you.','What do you like to eat?','Let’s find a budget that makes sense.'];
const b0=()=>{const P=S.P;return`<h2>What’s your goal?</h2>${GOALS.map(([v,t,s])=>card('goal',v,t,s,v=='light'&&P.age<18)).join('')}<h3 class="mt">About you</h3>${fld('name','Name or nickname',P.name,'maxlength="30" autocomplete="nickname"')}${fld('age','Age',P.age,'type="number" inputmode="numeric" min="13" max="80"')}
<div class="f"><span class="lb">Gender</span><div class="chs">${['woman','man','nb','self','skip'].map(v=>chS('gen',v,LB[v])).join('')}</div>${er('gen')}</div>${P.gen=='self'?fld('gt','Describe (optional)',P.gt,'maxlength="30"'):''}
<div class="two">${fld('w','Weight, kg (optional)',P.w,'type="number" inputmode="decimal"')}${fld('h','Height, cm (optional)',P.h,'type="number" inputmode="numeric"')}</div>${er('w')}${er('h')}<p class="mut sm mt">Only used to roughly estimate how much food you need. Skip them if you prefer.</p>
`};
const b1=()=>`<h2>Your routine</h2><div class="f"><span class="lb">Daily activity</span></div>${ACTS.map(([v,t,s])=>card('act',v,t,s)).join('')}${er('act')}
<div class="two">${sel('ex',['Exercise type (optional)',[['','Choose'],['strength','Strength'],['cardio','Cardio'],['sports','Sports'],['walk','Walking'],['other','Other'],['none','None']]])}${sel('exf',['Days per week (optional)',[['','Choose'],['0','Never'],['1-2','1–2'],['3-4','3–4'],['5+','5+']]])}</div>
`;
const b2=()=>`<h2>Health &amp; safety</h2><div class="f"><span class="lb">Food allergies (required)</span><div class="chs">${chM('al','none','None')}${ALG.map(([v,t])=>chM('al',v,t)).join('')}${chM('al','skip','Prefer not to say')}</div>${er('al')}</div>

function nutritionTotals(logs){
 const totals={k:0,cb:0,f:0,p:0,unknown:0};
 for(const log of logs){
  const meal=MB[log.id]||log.nutrition;
  if(!meal){totals.unknown++;continue}
  for(const key of ['k','cb','f','p'])totals[key]+=meal[key];
 }
 return totals;
}
function nutritionCards(logs,P){
 const totals=nutritionTotals(logs), T=targets(P);
 const energy=Math.max(1,Math.round((T.kLo+T.kHi)/2));
 const remaining=energy-totals.k;
 const meter=(name,value,target)=>`<progress class="nutrition-meter" aria-label="${name}" value="${Math.min(value,target)}" max="${target}"></progress>`;
 const macro=(name,value,target)=>`<div><h3>${name}</h3><b>${nutritionNumber(value)} g</b> <span class="mut sm">/ ${target} g</span>${meter(name,value,target)}</div>`;
 return `<section aria-label="Nutrition logged today">
 <div class="card nutrition-card">
  <div class="nutrition-title"><h2>Calories</h2><span class="mut sm">Logged today</span></div>
  <div class="nutrition-count"><span><strong>${nutritionNumber(totals.k)}</strong> <span class="mut sm">/ ${energy.toLocaleString('en-MY')} kcal</span></span><span class="mut sm">${nutritionNumber(Math.abs(remaining))} kcal ${remaining<0?'over target':'left'}</span></div>

 </div>

 </section>`;
}

function referenceNutrition(food,grams){
 const values={};
 for(const key of ['k','cb','f','p'])values[key]=Number((food[key]*grams/food.g).toFixed(2));
 return values;
}
function referenceCards(terms){
 const matches=REFERENCE_FOODS.filter(food=>terms.every(term=>normalizeFoodSearch(food.n+' '+food.alias).includes(term)));
 if(!matches.length)return '';
 return `<section class="card mt" aria-label="Foods with nutrition estimates"><h2>Available to log</h2>
 ${matches.map(food=>`<div class="ml"><div style="flex:1"><b>${esc(food.n)}</b>
 <p class="mut sm">${food.g} g reference portion · ${food.k} kcal · ${nutritionNumber(food.cb)} g carbs · ${nutritionNumber(food.f)} g fat · ${nutritionNumber(food.p)} g protein</p>
 <p class="mut sm"><a href="${food.source}" target="_blank" rel="noopener">MyFCD nutrition estimate</a></p>
 <p class="mut sm"><a href="${food.price.url}" target="_blank" rel="noopener">${esc(food.price.label)}</a>: ${rm(food.price.rm)} for ${esc(food.price.item)}. Vendor portion may differ.</p>
 <p class="mut sm">Allergens unknown. Check with the vendor.</p>
 </div><button class="btn bs" data-a="logref" data-v="${food.id}">Log</button></div>`).join('')}</section>`;
}
let exploreMode='meals', catalogueQuery='', catalogueLimit=cataloguePageSize;
function catalogueList(){
 const terms=normalizeFoodSearch(catalogueQuery).trim().split(/\s+/).filter(Boolean);
 const matches=MALAYSIAN_FOODS.filter((row,i)=>terms.every(term=>foodSearch[i].includes(term)));
 const list=matches.slice(0,catalogueLimit).map(([,english,malay,mandarin,tamil])=>{
  const name=malay||english||mandarin||tamil;
  const englishName=english&&english!==name?`<div class="mut sm">${esc(english)}</div>`:'';
  return `<div class="ml"><div><b>${esc(name)}</b>${englishName}</div></div>`;
 }).join('');
 return `${referenceCards(terms)}<p class="mut sm">${matches.length.toLocaleString('en-MY')} foods found</p>
 ${list||'<p class="mut mt">No foods match that search.</p>'}
 ${matches.length>catalogueLimit?'<button class="btn s" data-a="catmore">Show more foods</button>':''}`;
}

function whyL(m,ids){const P=S.P,n=S.plan.days.flat().filter(x=>x==m.id).length;return[`R1–R3 Safety: passes your allergy and ${LB[P.diet].toLowerCase()} filters${P.dl.length?' and avoids foods you dislike':''}.`,`R4 Budget: this day totals ${rm(tot(ids))}, within ${rm(P.bud)}.`,`R6 Goal (${GN()}): ${m.p} g protein${m.p>=MED[m.c]?', higher than a typical '+CN[m.c].toLowerCase()+' option.':'.'}`,`R5 Variety: used ${n}× this week.`]}
function mealSheet(s){const m=MB[s.id],ids=s.d!=null?S.plan.days[s.d]:null;return`<div class="row">${th(m)}<div><h2>${esc(m.n)}</h2><div class="mut sm">${CN[m.c]} · estimated ${rm(m.rm)}</div></div></div><div class="two mt"><div class="card tc" style="margin:0"><b>${m.k}</b><div class="mut sm">kcal</div></div><div class="card tc" style="margin:0"><b>${m.p} g</b><div class="mut sm">protein</div></div><div class="card tc" style="margin:0"><b>${m.cb} g</b><div class="mut sm">carbs</div></div><div class="card tc" style="margin:0"><b>${m.f} g</b><div class="mut sm">fat</div></div></div>
<p class="sm mt"><b>Ingredients:</b> ${m.ing.join(', ')}</p><p class="sm"><b>Allergens:</b> ${m.unk?'data incomplete (treated as unknown)':m.al.length?m.al.map(a=>LB[a]).join(', '):'none listed'}</p><h3 class="mt">Why recommended?</h3>${ids?`<ul class="sm">${whyL(m,ids).map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="sm mut">This meal passes your allergy, diet and dislike filters. It isn’t in your plan unless shown on a day.</p>'}<p class="mut sm mt">Price and nutrition are illustrative estimates.</p>
${ids?`<button class="btn s" data-a="swap" data-i="${s.i}" data-d="${s.d}">Swap meal</button>`:''}<button class="btn" data-a="log" data-v="${m.id}" ${s.i!=null?`data-i="${s.i}"`:''}>Log as eaten</button>`}
function swapOptions(s){
 const ids=S.plan.days[s.d], current=MB[ids[s.i]], total=tot(ids);
 return elig(S.P).out.filter(m=>m.c==current.c&&!ids.includes(m.id)).sort((a,b)=>a.rm-b.rm)
  .map(meal=>({meal,total:Math.round((total-current.rm+meal.rm)*100)/100}))
  .filter(option=>option.total<=S.P.bud);
}
function swapSheet(s){
 const options=swapOptions(s), selected=options.find(option=>option.meal.id==s.selected);
 return `<div class="row sp"><h2>Swap ${SL[s.i].toLowerCase()}</h2>${sisi('plan',48)}</div>
 <p class="mut sm">Choose a meal to see the updated day total.</p>
 ${options.length?options.map(({meal,total})=>`<button class="oc swap-option ${s.selected==meal.id?'on':''}" aria-pressed="${s.selected==meal.id}" data-a="selectswap" data-v="${meal.id}"><b>${esc(meal.n)}</b><span class="mut sm">${rm(meal.rm)} · ${rm(total)} day total</span></button>`).join(''):`<div class="tc mt">${sisi('empty',70)}<p>No alternate meal fits your food filters and budget.</p></div>`}
 ${selected?`<div class="bn w row sp"><b>New day total</b><b>${rm(selected.total)}</b></div>`:''}
 <button class="btn" data-a="doswap" ${selected?'':'disabled'}>Confirm swap</button>`;
}
function logSheet(s){
 const ref=referenceFood(s.v);
 if(ref)return `<div class="row sp"><h2>Log ${esc(ref.n)}</h2>${sisi('meal',56)}</div>
 <p class="mut sm">Nutrition is estimated by portion weight. Allergens are unknown. Check with the vendor.</p>
 <div class="f"><label for="lsl">Meal time</label><select id="lsl">${['Breakfast','Lunch','Dinner','Snack'].map((label,i)=>`<option value="${i}" ${ref.slot===i?'selected':''}>${label}</option>`).join('')}</select></div>
 <div class="f"><label for="lg">Portion (g)</label><input id="lg" type="number" inputmode="decimal" min="1" max="2000" step="any" value="${ref.g}"></div>
 <div class="f"><label for="lc">Actual cost (RM)</label><input id="lc" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Enter what you paid"></div>
 <p class="mut sm mt">Campus price example: ${rm(ref.price.rm)}. Your price may differ.</p>
 <p id="le" class="er" role="alert"></p><button class="btn" data-a="savelog">Save log</button>`;
 const sl=s.i!=null?Math.min(s.i,3):0,o=elig(S.P).out,id=s.v&&MB[s.v]?s.v:'';return`<div class="row sp"><h2>Log a meal</h2>${sisi('meal',56)}</div><div class="f"><label for="lsl">Meal time</label><select id="lsl">${['Breakfast','Lunch','Dinner','Snack'].map((t,i)=>`<option value="${i}" ${i==sl?'selected':''}>${t}</option>`).join('')}</select></div>
<div class="f"><label for="lm">Meal</label><select id="lm">${o.map(m=>`<option value="${m.id}" ${m.id==id?'selected':''}>${esc(m.n)}</option>`).join('')}<option value="" ${id?'':'selected'}>Something else</option></select></div><div class="f"><label for="ln">Name (if something else)</label><input id="ln" maxlength="40"></div><div class="f"><label for="lc">Actual cost (RM)</label><input id="lc" type="number" inputmode="decimal" step="0.01" min="0" value="${id?MB[id].rm:''}"></div><p id="le" class="er" role="alert"></p><p class="mut sm mt">Meals you add yourself are not safety-checked. Logged today only.</p><button class="btn" data-a="savelog">Save log</button>`}
function howSheet(){const t=(S.plan||PL)?.tr,r=t?.rej||{};return`<h2>How recommendations work</h2><p class="mut">SiswaDiet is a rule-based expert system. The same answers always give the same plan.</p><ol class="sm"><li><b>R1 Allergies.</b> Meals with your allergens are removed. Meals with incomplete allergen data are hidden if you list allergies or prefer not to say.</li><li><b>R2 Diet.</b> Vegan, vegetarian and pescatarian rules apply to every meal.</li><li><b>R3 Dislikes.</b> Disliked ingredients are skipped.</li><li><b>R4 Budget.</b> Breakfast + lunch + dinner (+ up to 2 snacks) must total no more than your daily budget. Nothing goes over.</li><li><b>R5 Variety.</b> Repeats are penalised across the week.</li><li><b>R6 Goal.</b> Days are ranked by how close they get to rough protein and calorie targets. “Goal minimum” is the cheapest day in this meal list that reaches them.</li></ol>
${t?`<div class="card sm"><h3>Your last run</h3><p>${t.ok} of ${t.all} meals kept. Removed: ${r.allergen||0} allergen, ${r.unknown||0} unknown data, ${r.diet||0} diet, ${r.dislike||0} dislike.</p><p>${t.n} complete days checked, ${t.fit} fit your budget. Targets: about ${t.T.pro} g protein, ${t.T.kLo}–${t.T.kHi} kcal.${t.minGoal!=null?` Cheapest day reaching them: ${rm(t.minGoal)}.`:' No day in this list reaches them.'}</p></div>`:''}<p class="mut sm mt">Limits: meals, prices and nutrition are illustrative estimates, not a verified database. Under-18 profiles never get weight-loss targets. Ask a doctor or dietitian about health conditions.</p>`}
const shv=()=>`<div class="bk" data-a="bk"><div class="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="row sp"><span></span><button class="lk x" data-a="close" aria-label="Close">${ic('x')}</button></div>${{meal:mealSheet,swap:swapSheet,log:logSheet,how:howSheet}[sheet.t](sheet)}</div></div>`;

/* ===== RENDER + EVENTS ===== */
function R(){const f={load:vLoad,auth:vAuth,welcome:vWel,wiz:vWiz,rev:vRev,ana:vAna,res:vRes,app:()=>({home:vHome,plan:vPlan,explore:vExp,prog:vProg,prof:vProf}[tab])()}[V];
 $('#app').innerHTML=`<div class="v${foc?' nv':''}" id="vw" tabindex="-1">${f()}</div>${V=='app'?nav():''}`;$('#sh').innerHTML=sheet?shv():'';
 if(sheet)$('#sh .x').focus();else if(foc){$('#vw').focus({preventScroll:true});scrollTo(0,0);foc=0}}
const toast=(m,v)=>{clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast">${v?sisi(v,40):''}<span>${esc(m)}</span></div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',2400)};
const go=(v,t)=>{V=v;if(t)tab=t;sheet=null;foc=1;R()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,k=t.dataset.k,I=t.dataset.i!=null?+t.dataset.i:null,D=t.dataset.d!=null?+t.dataset.d:null;
 if(a=='bk'){if(e.target==t){sheet=null;R()}return}
 if(a=='hop'){t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop');return}
 if(a=='start'){S.P=freshP();S.P.name=U?.displayName||'';S.sample=false;errs={};step=0;go('wiz')}
 else if(a=='cont')go('app','home');
 else if(a=='sample'){S.P=JSON.parse(JSON.stringify(SAMPLE));S.sample=true;gen()}
 else if(a=='pick'){S.P[k]=v;delete errs[k];save();R()}
 else if(a=='tog'){tog(k,v);save();R()}
 else if(a=='setbud'){S.P.bud=+v;delete errs.bud;save();R();$('#vw [data-a=setbud][aria-pressed=true]')?.focus()}
 else if(a=='next'){
  errs=val(step,S.P);
  if(Object.keys(errs).length){R();$('#vw .er')?.scrollIntoView({block:'center'});return}
  if(profileEdit){profileEdit=false;save();go('app','prof')}
  else if(reviewEdit){reviewEdit=false;save();go('rev')}
  else if(step<4){step++;S.setupStep=step;save();go('wiz')}
  else{S.setupStep=step;save();go('rev')}
 }
 else if(a=='back'){if(profileEdit){profileEdit=false;go('app','prof')}else if(reviewEdit){reviewEdit=false;go('rev')}else if(step>0){step--;S.setupStep=step;save();go('wiz')}else go(S.plan?'app':'welcome')}
 else if(a=='profileedit'){profileEdit=true;reviewEdit=false;step=+v;errs={};go('wiz')}
 else if(a=='edit'){reviewEdit=V=='rev'||V=='res';step=+v;errs={};go('wiz')}
 else if(a=='gen'){if(!missing().length)gen()}
 else if(a=='setbudgen'){S.P.bud=+v;gen()}
 else if(a=='goalbal'){S.P.goal='balanced';gen()}
 else if(a=='done'){day=wd();go('app','home')}
 else if(a=='how'){sheet={t:'how'};R()}
 else if(a=='close'){sheet=null;R()}
 else if(a=='go'){day=tab=='plan'&&v=='plan'?day:wd();go('app',v)}
 else if(a=='day'){day=+v;R()}
 else if(a=='expview'){exploreMode=v;R();$('#vw [data-a=expview][aria-pressed=true]')?.focus()}
 else if(a=='catmore'){catalogueLimit+=cataloguePageSize;const list=$('#clist');const firstNew=list.querySelectorAll('.ml').length;list.innerHTML=catalogueList();const row=list.querySelectorAll('.ml')[firstNew];if(row){row.tabIndex=-1;row.focus()}}
 else if(a=='cf'){CF=v;R()}
 else if(a=='so'){SO=-SO;R()}
 else if(a=='meal'){sheet={t:'meal',id:v,i:I,d:D};R()}
 else if(a=='swap'){sheet={t:'swap',i:I,d:D};R()}
 else if(a=='logref'&&referenceFood(v)){sheet={t:'log',v};R()}
 else if(a=='log'){sheet={t:'log',v,i:I};R()}
 else if(a=='selectswap'){sheet.selected=v;R();$('#sh .swap-option.on')?.focus()}
 else if(a=='doswap'){
  const selected=swapOptions(sheet).find(option=>option.meal.id==sheet.selected);
  if(!selected)return;
  S.plan.days[sheet.d][sheet.i]=selected.meal.id;
  save();sheet=null;R();toast('Meal swapped. New day total: '+rm(selected.total),'plan');
 }
 else if(a=='savelog'){
  const ref=referenceFood(sheet?.v);
  const id=ref?.id||$('#lm').value,n=ref?.n||$('#ln')?.value.trim(),c=parseFloat($('#lc').value),s=+$('#lsl').value;
  const grams=ref?Number($('#lg').value):null;
  if(ref&&!(grams>=1&&grams<=2000))return $('#le').textContent='Enter a portion from 1 to 2,000 g.';
  if(!id&&!n)return $('#le').textContent='Pick a meal or type a name.';if(!Number.isFinite(c)||c<0)return $('#le').textContent='Enter the cost in RM, or 0.';
  S.logs=S.logs.filter(l=>!(l.d==today()&&(s<3?l.s==s:l.s==3&&l.id==id)));S.logs.push({d:today(),s,id:id||null,n:ref?.n||(id?MB[id].n:n),rm:+c.toFixed(2),chk:!!MB[id],t:Date.now(),...(ref?{grams,nutrition:referenceNutrition(ref,grams)}:{})});save();sheet=null;const n3=new Set(S.logs.filter(l=>l.d==today()&&l.s<3).map(l=>l.s)).size;toast(n3>=3?'All 3 meals logged. Great day!':'Meal logged. Yum!',n3>=3?'celebrate':'meal');R()}
 else if(a=='theme'){S.theme=S.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save();R()}
 else if(a=='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));l.download='siswadiet-data.json';l.click()}
 else if(a=='exit')signOut(auth);
 else if(a=='upd'){toast('Checking for updates…');window.checkUpdate().then(r=>toast(r=='new'?'New version found. Tap the banner at the top.':r=='same'?'You have the latest version.':'Could not check. Try again when online.'))}
 else if(a=='amode'){AM=AM=='in'?'up':'in';R()}
 else if(a=='areset'){const em=$('#ae').value.trim(),er=$('#aer');if(!CFG_OK)return;if(!em)return er.textContent='Type your email above first.';sendPasswordResetEmail(auth,em).then(()=>{er.style.color='var(--mt)';er.textContent='Reset link sent. Check your email.'}).catch(x=>{er.style.color='';er.textContent=fe(x)})}
 else if(a=='reset'){if(confirm('Delete all your SiswaDiet data? Your login stays.')){try{localStorage.removeItem(lk())}catch(x){}deleteDoc(doc(db,'users',U.uid,'app','state')).catch(()=>{});S=freshS();S.P.name=U?.displayName||'';PL=null;document.documentElement.dataset.theme='';go('welcome')}}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(t.id=='as'){$('#ap').type=t.checked?'text':'password';return}if(t.id=='lm'){$('#lc').value=MB[t.value]?.rm??'';return}if(!k)return;
 if(k=='cq'){catalogueQuery=t.value;catalogueLimit=cataloguePageSize;$('#clist').innerHTML=catalogueList();return}
 if(k=='q'){Q=t.value;$('#elist').innerHTML=elist();return}
 S.P[k]=['age','w','h','bud'].includes(k)?(t.value===''?undefined:+t.value):t.value;if(k=='bud')$('#bfeed').innerHTML=bfeed();
 if(errs[k]){delete errs[k];t.parentNode.querySelector('.er')?.remove()}save()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&sheet){sheet=null;R()}});
const fe=x=>{const c=x.code||'';return/invalid-credential|wrong-password|user-not-found/.test(c)?'Email or password is wrong. Check and try again.':/email-already/.test(c)?'This email already has an account. Log in instead.':/weak-password/.test(c)?'Password needs at least 6 characters.':/invalid-email/.test(c)?'Enter a valid email address.':/network/.test(c)?'No internet connection. Connect and try again.':/too-many/.test(c)?'Too many tries. Wait a minute and try again.':'Something went wrong ('+c+').'};
document.addEventListener('submit',async e=>{if(e.target.id!='af')return;e.preventDefault();const em=$('#ae').value.trim(),pw=$('#ap').value,nm=$('#an')?.value.trim(),er=m=>{$('#aer').style.color='';$('#aer').textContent=m;$('#abtn').disabled=false};
 if(!CFG_OK)return er('Add your Firebase config to the file first.');if(!em||!pw)return er('Enter your email and password.');if(AM=='up'&&!nm)return er('Enter a name or nickname.');
 $('#abtn').disabled=true;$('#aer').textContent='';
 try{if(AM=='up'){signupName=nm;const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:nm});if(U?.uid==c.user.uid&&!S.P.name){S.P.name=nm;save()}}else await signInWithEmailAndPassword(auth,em,pw)}catch(x){signupName='';if($('#af'))er(fe(x))}});
if(CFG_OK)onAuthStateChanged(auth,async u=>{U=u;if(!u){S=freshS();PL=null;V='auth';document.documentElement.dataset.theme='';return R()}
 V='load';R();let d=null;try{const g=await getDoc(doc(db,'users',u.uid,'app','state'));if(g.exists())d=JSON.parse(g.data().json)}catch(e){}
 if(!d)try{d=JSON.parse(localStorage.getItem(lk()))}catch(e){}
 S=d&&d.v==2?d:freshS();if(!S.P.name)S.P.name=u.displayName||signupName||'';signupName='';reviewEdit=false;errs={};step=Number.isInteger(S.setupStep)&&S.setupStep>=0&&S.setupStep<=4?S.setupStep:0;PL=S.plan;V=S.plan?'app':'wiz';tab='home';day=wd();document.documentElement.dataset.theme=S.theme||'';R()});
else{V='auth';R()}
</script><script>
/* Auto-update: remembers the page's version stamp when the app opens, then re-checks GitHub. Nothing to edit when you update. */
navigator.serviceWorker?.getRegistrations().then(r=>r.forEach(x=>x.unregister()));
const RUNNING=Date.parse(document.lastModified);let base=null;
const stamp=async()=>{const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'}),lm=r.headers.get('last-modified');return{t:lm?Date.parse(lm):0,e:r.headers.get('etag')||''}};
function banner(){if(document.getElementById('upd'))return;const b=document.createElement('button');b.id='upd';b.textContent='New version available. Tap to update';
 b.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:#6C5CE7;color:#fff;border:0;border-radius:99px;padding:12px 20px;font:700 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.25)';
 b.onclick=()=>{location.href=location.pathname+'?v='+Date.now()};document.body.appendChild(b)}
window.checkUpdate=async()=>{try{const n=await stamp();if(!n.t&&!n.e)return'unknown';
 if(!base){base={t:n.t?Math.min(n.t,RUNNING||n.t):0,e:n.e}}
 const ch=(n.t&&base.t&&n.t-base.t>2000)||(base.e&&n.e&&n.e!==base.e);if(ch)banner();return ch?'new':'same'}catch(e){return'error'}};
checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});setInterval(checkUpdate,120000);
</script>
