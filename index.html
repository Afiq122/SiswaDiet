<style>
:root{--pri:#6C5CE7;--ink:#20233D;--lav:#EDE9FE;--mint:#34D399;--mt:#0F7F5F;--mw:#D1FAE5;--cor:#FF8A78;--yel:#F59E0B;--bg:#FFF7ED;--card:#fff;--mut:#666D86;--bd:#E9EBF3;--err:#C9405A;--ew:#FDECEF;--yw:#FEF3C7;color-scheme:light}
:root[data-theme=dark]{--ink:#F1F2FA;--lav:#2B2866;--mw:#12372F;--bg:#14162B;--card:#1E2140;--mut:#A9AEC8;--bd:#2D3156;--err:#FF8DA0;--ew:#3A1C2A;--yw:#3B3216;--mt:#5FE0BC;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3,p,ol,ul{margin:0}h1{font-size:28px;line-height:1.15;font-weight:800}h2{font-size:21px;font-weight:800}h3{font-size:16px;font-weight:800}ol,ul{padding-left:20px}li{margin-top:6px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.v{outline:0}.nv{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mut{color:var(--mut)}.sm{font-size:13px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g{display:grid;gap:8px}.mt{margin-top:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tc{text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:0 6px 24px rgba(32,35,61,.06);margin-top:14px}
.btn{min-height:52px;border:0;border-radius:16px;background:var(--pri);color:#fff;font-weight:800;padding:0 22px;width:100%;margin-top:8px;transition:transform .12s}
.btn:active{transform:scale(.98)}.btn.s{background:var(--lav);color:var(--pri)}.btn.o{background:none;border:1.5px solid var(--bd);color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.bs{min-height:44px;width:auto;padding:0 16px;font-size:14px;margin:0}
.lk{background:none;border:0;color:var(--pri);font-weight:700;min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:4px}
.f{display:grid;gap:6px;margin-top:14px}.lb,.f label{font-weight:700;font-size:14px}
input,select{width:100%;min-height:48px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);padding:0 14px}
.big{font-size:40px;font-weight:800;text-align:center;min-height:72px}.er{color:var(--err);font-size:13px;font-weight:600}
.oc{min-height:56px;text-align:left;border:1.5px solid var(--bd);border-radius:16px;background:var(--card);padding:10px 14px;display:grid;margin-top:8px;width:100%}.oc.on{border-color:var(--pri);background:var(--lav)}.oc small{color:var(--mut)}.oc:disabled{opacity:.45}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ch{min-height:44px;border:1.5px solid var(--bd);border-radius:99px;background:var(--card);padding:0 16px;font-weight:600}.ch.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pb{height:8px;border-radius:4px;background:var(--lav);overflow:hidden}.pb i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.tip{display:flex;gap:10px;align-items:center;background:var(--lav);border-radius:20px;padding:8px 14px;margin:12px 0}
.bn{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}.bn.w{background:var(--yw)}.bn.e{background:var(--ew)}.bn.k{background:var(--mw)}
.ml{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}.ml:first-child{border:0}.th{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.pl{display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:0;flex:1}.ok{color:var(--mt);font-weight:800;display:inline-flex;align-items:center;gap:4px;font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--mut);font-size:11px;font-weight:700;display:grid;place-items:center;gap:2px;padding-top:6px}nav .on{color:var(--pri)}
.bk{position:fixed;inset:0;background:rgba(20,22,43,.5);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:min(100%,520px);max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));animation:in .2s}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 18px 6px 10px;border-radius:99px;z-index:20;font-weight:600;display:flex;align-items:center;gap:8px}
.dp{flex:1;min-height:44px;border:1px solid var(--bd);border-radius:14px;background:var(--card);font-weight:700;font-size:13px;padding:0}.dp.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tot{position:sticky;top:0;z-index:3;margin:0 -16px;padding:4px 16px;background:var(--bg)}
.wel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;background:linear-gradient(180deg,var(--lav),var(--bg));border-radius:28px;padding:28px 20px;margin-top:8px}.wel.full{min-height:calc(100vh - 48px);justify-content:center}.wel>*{max-width:100%}
.bg2{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.bg2.off{opacity:.5}.bars{display:grid;grid-template-columns:34px 1fr 62px;gap:8px;align-items:center;font-size:13px}

.sp{position:relative;display:inline-block;flex:none;isolation:isolate;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sp img{height:100%;width:auto;display:block;transform-origin:50% 100%;user-select:none;-webkit-user-drag:none}
.sp::after{content:"";position:absolute;left:14%;right:14%;bottom:-3%;height:7%;border-radius:50%;background:rgba(108,92,231,.2);z-index:-1}
.sp-load img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);opacity:0}.sp-load img:first-child{opacity:1}
.sp b{position:absolute;opacity:0;pointer-events:none}.sp i{width:6px;height:6px;border-radius:50%;background:var(--pri);opacity:.3;position:absolute;top:8%;right:-4%}
.logo{width:min(66vw,230px);height:auto;border-radius:28%;filter:drop-shadow(0 12px 18px rgba(108,92,231,.35))}
.cf{width:7px;height:7px;border-radius:2px}.cf.a{left:6%;top:22%;background:var(--cor)}.cf.b{right:4%;top:10%;background:var(--mint)}.cf.c{left:-2%;top:48%;background:var(--yel)}.cf.d{right:-2%;top:42%;background:var(--pri)}
.st{width:12px;height:12px;background:var(--yel);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}.st.a{left:2%;top:6%}.st.b{right:0;bottom:30%}
.ht{right:0;top:6%;color:var(--cor);font-size:14px}
@media(prefers-reduced-motion:no-preference){
.sp::after{animation:shd var(--d,2.6s) ease-in-out infinite}@keyframes shd{50%{transform:scaleX(.78);opacity:.55}}
.sp-hero img{animation:bob 2.6s ease-in-out infinite}.sp-meal img{animation:chew 1.1s ease-in-out infinite}.sp-goal{--d:1.1s}.sp-goal img{animation:jump 1.1s cubic-bezier(.3,.7,.4,1) infinite}
.sp-think img{animation:sway 3s ease-in-out infinite}.sp-work img{animation:type .5s ease-in-out infinite}.sp-plan img{animation:wig 2.4s ease-in-out infinite}.sp-muscle{--d:1.2s}.sp-muscle img{animation:pump 1.2s ease-in-out infinite}
.sp-rest{--d:4s}.sp-rest img{animation:breathe 4s ease-in-out infinite}.sp-budget img{animation:tada 2.2s ease-in-out infinite}.logo{animation:bob 3.2s ease-in-out infinite}
.sp-load{animation:walk .6s ease-in-out infinite}.sp-load img{animation:vis 1.8s infinite}.sp-load img:nth-child(2){animation-delay:.6s}.sp-load img:nth-child(3){animation-delay:1.2s}
.sp.hop img{animation:hop .6s ease-out}
.cf{animation:cf 1.1s infinite}.cf.b{animation-delay:.25s}.cf.c{animation-delay:.5s}.cf.d{animation-delay:.75s}.st{animation:tw 1.6s ease-in-out infinite}.st.b{animation-delay:.8s}.ht{animation:ht 2s infinite}
.sp i{animation:dt 1s infinite}.sp i:nth-of-type(2){right:-12%;animation-delay:.2s}.sp i:nth-of-type(3){right:-20%;animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes chew{0%,100%{transform:none}20%{transform:scale(1.04,.95)}40%{transform:translateY(-3px) rotate(-2deg)}60%{transform:scale(1.03,.96) rotate(2deg)}80%{transform:translateY(-2px)}}
@keyframes jump{0%,100%{transform:scale(1.06,.92)}30%{transform:translateY(-16%) scale(.96,1.06) rotate(-3deg)}55%{transform:translateY(-16%) rotate(3deg)}75%{transform:scale(1.06,.92)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2px)}}
@keyframes type{50%{transform:translateY(2px) rotate(.5deg)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-3px)}75%{transform:rotate(4deg) translateY(-3px)}}
@keyframes pump{0%,100%{transform:scale(1.04,.95)}45%{transform:translateY(-9%) scale(.97,1.04)}60%{transform:translateY(-9%) rotate(-2deg)}}
@keyframes breathe{50%{transform:scale(1.03,1.05)}}
@keyframes tada{0%,100%{transform:none}10%,20%{transform:scale(.96) rotate(-3deg)}30%,50%,70%{transform:scale(1.06) rotate(3deg)}40%,60%{transform:scale(1.06) rotate(-3deg)}80%{transform:none}}
@keyframes hop{30%{transform:translateY(-22%) scale(.95,1.08)}60%{transform:scale(1.08,.9)}}
@keyframes walk{50%{transform:translateY(-5px)}}@keyframes vis{0%,33%{opacity:1}34%,100%{opacity:0}}
@keyframes cf{0%{opacity:0;transform:translateY(8px) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-24px) rotate(160deg)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes ht{0%{opacity:0;transform:translateY(6px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-18px) scale(1.1)}}
@keyframes dt{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}}
/* SiswaDiet campus planner */
:root{--pri:#541b98;--ink:#25133e;--lav:#f0e4fc;--bg:#faf7fe;--card:#fff;--bd:#e8dbf3;--mut:#695779;--mw:#eff9ce;--mt:#3d5f08}
:root[data-theme=dark]{--pri:#ab7be7;--ink:#faf1ff;--lav:#392252;--bg:#1d102c;--card:#271639;--bd:#49335e;--mut:#d3bfdf;--mw:#34401e;--mt:#d6efaa}
h1{font-size:clamp(27px,7vw,35px);letter-spacing:-.045em}
.row.sp{display:flex;cursor:auto;isolation:auto}.row.sp::after{content:none}
.oc.on,.swap-option.on{background:var(--mw);border-color:var(--mt);color:var(--ink)}
.budget-card{background:var(--lav);padding:20px}.budget-value{font-weight:800;font-size:34px;line-height:1.1}
.budget-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd);border-radius:14px;overflow:hidden;margin-top:14px}
.budget-stats div{background:var(--card);padding:10px 12px}.budget-stats b{display:block}
.week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}.week-days button{font-size:11px}
.preview{width:100%;text-align:left;margin:0}.preview .ml{justify-content:space-between}
.swap-option{margin-top:8px}
nav button[aria-current=page]{color:var(--pri);background:var(--lav);border-radius:16px}
@media(prefers-reduced-motion:no-preference){
.logo{animation:logo-arrive .55s ease-out both}
.sp-hero img{animation:bob 3.1s ease-in-out 2}
.sp-goal img{animation:jump .85s ease-out 2}
.sp-budget img{animation:tada 1.35s ease-in-out 1}
.sp-meal img{animation:chew 1.25s ease-in-out 2}
.sp-plan img{animation:wig 1.1s ease-in-out 2}
.sp-think img{animation:sway 2.6s ease-in-out 2}
.sp-muscle img{animation:pump 1.05s ease-in-out 2}
.sp-rest img{animation:breathe 3.5s ease-in-out 2}
.sp::after,.sp b{animation-iteration-count:2}
.sp.hop img{animation:hop .6s ease-out}
.sheet{animation:sheet-arrive .25s ease-out both}
@keyframes logo-arrive{from{opacity:.2;transform:translateY(8px) scale(.96)}}
@keyframes sheet-arrive{from{transform:translateY(28px);opacity:.65}}
}
/* Keep normal scrolling while disabling browser touch zoom where supported. */
html, body, .sheet {
  touch-action: pan-x pan-y;
}

@media (pointer: coarse), (max-width: 600px) {
  input:not(.big), select, textarea {
    font-size: max(16px, 1em);
  }
}
/* Today nutrition and grouped profile */
.nutrition-card{--nutr:#6724a4}
:root[data-theme=dark] .nutrition-card{--nutr:#bc92ec}
.nutrition-title,.nutrition-count{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nutrition-count{margin-top:8px;flex-wrap:wrap}
.nutrition-count strong{font-size:22px}
.nutrition-meter{display:block;width:100%;height:8px;margin-top:8px;border:0;border-radius:99px;overflow:hidden;background:var(--lav);appearance:none}
.nutrition-meter::-webkit-progress-bar{background:var(--lav);border-radius:99px}
.nutrition-meter::-webkit-progress-value{background:var(--nutr);border-radius:99px;transition:width .25s ease}
.nutrition-meter::-moz-progress-bar{background:var(--nutr);border-radius:99px}
.nutrition-macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nutrition-macros h3{font-size:13px;margin-bottom:4px}
.nutrition-macros b{white-space:nowrap}
.profile-header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--lav)}
.profile-header h2,.profile-header p{overflow-wrap:anywhere}
.profile-avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;font-size:20px;font-weight:800}
.profile-stats{text-align:center;line-height:1.2}
.profile-group{padding:0;overflow:hidden}
.profile-heading{margin:20px 2px 6px;color:var(--mut)}
.profile-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;min-height:51px;padding:10px 14px;border:0;border-bottom:1px solid var(--bd);background:var(--card);color:var(--ink)}
.profile-item:last-child{border-bottom:0}.profile-item>svg{color:var(--pri)}
.profile-item:focus-visible{outline-offset:-4px}.profile-item:hover{background:var(--lav)}
.profile-item.danger{color:var(--err)}.profile-arrow{font-size:20px;color:var(--mut)}
.food-add{font-size:24px;min-width:44px;border-radius:50%;background:var(--lav);justify-content:center}
.scan-preview{display:block;width:100%;max-height:230px;object-fit:contain;border-radius:16px}
.toast-single{box-sizing:border-box;width:max-content;max-width:calc(100vw - 24px);padding:10px 16px;justify-content:center;text-align:center;white-space:nowrap;font-size:clamp(12px,4vw,16px)}
.gender-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:360px;margin:8px auto 0}
.gender-options .ch{display:flex;align-items:center;justify-content:center;min-height:48px;padding:8px 6px;text-align:center;line-height:1.25}
/* Sign-in layout is isolated from the padding used by the planner tabs. */
html:has(.auth-shell),body:has(.auth-shell){overflow:hidden;overscroll-behavior:none}
.app.auth-shell{position:fixed;inset-inline:0;top:var(--auth-top,0px);height:100vh;height:var(--auth-height,100dvh);max-width:none;margin:0;padding:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--bg)}
.auth-shell::-webkit-scrollbar{display:none}
.auth-shell #vw{min-height:100%;display:flex;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.auth-view{width:min(100%,400px);margin:auto;display:grid;gap:clamp(12px,2.4dvh,24px);text-align:center}
.auth-brand{display:grid;justify-items:center;gap:6px}
.auth-logo-frame{display:grid;place-items:center;width:clamp(68px,11dvh,100px);aspect-ratio:1;border:1px solid var(--bd);border-radius:26%;background:var(--card);box-shadow:0 3px 8px rgba(41,21,59,.07);margin-bottom:8px}
.auth-logo-frame img{display:block;width:78%;height:78%;object-fit:contain}
.auth-brand h1{font-size:clamp(24px,6.65vw,30px);letter-spacing:-.045em}
.auth-brand p{color:var(--mut);font-size:13px}
.auth-form.card{margin:0;padding:clamp(13px,4vw,22px);text-align:left;box-shadow:0 3px 10px rgba(41,21,59,.08);border-radius:24px;display:grid;gap:12px}
.auth-field{display:grid;gap:5px}
.auth-field>label{font-size:13px;font-weight:800}
.auth-entry{display:flex;align-items:center;gap:9px;min-height:46px;padding:0 12px;border:1px solid var(--bd);border-radius:13px;background:var(--bg);color:var(--mut)}
.auth-entry:focus-within{outline:2px solid var(--pri);outline-offset:1px}
.auth-entry svg{flex:none}
.auth-entry input{width:100%;min-width:0;min-height:44px;padding:0;border:0;background:none;outline:none;color:var(--ink);font-size:16px}
.auth-entry input:focus-visible{outline:none}
.auth-tools{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0 8px;font-size:12px}
.auth-tools label{display:flex;align-items:center;gap:7px;min-height:44px;cursor:pointer}
.auth-tools input{width:16px;height:16px;min-height:0;accent-color:var(--pri);margin:0}
.auth-tools .lk{padding:0;font-size:inherit}
.auth-form .btn,.auth-alternate .btn{margin:0;min-height:45px;font-size:14px}
.auth-form .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.auth-alternate{display:grid;gap:10px}
.auth-divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}
.auth-divider::before,.auth-divider::after{content:"";height:1px;background:var(--bd);flex:1}
.auth-alternate .btn{background:var(--card);color:var(--pri);border:1px solid var(--bd)}
.auth-privacy{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:11px}
.auth-privacy svg{color:var(--mt)}
.auth-form #aer:empty{display:none}
@media(max-height:700px){.auth-view{gap:12px}.auth-form.card{gap:8px}.auth-logo-frame{margin-bottom:3px}}
.rule-picks{display:grid;gap:8px;margin-top:10px}
.rule-picks .swap-option{margin:0}
.rule-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.rule-badge{border-radius:99px;background:var(--lav);padding:3px 8px;font-size:11px}
.rule-list{padding-left:20px}
.rule-list li+li{margin-top:6px}
.preview-days>details{border-top:1px solid var(--bd);padding:9px 0}
.preview-days summary{cursor:pointer}
.budget-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.budget-head .btn{width:auto;min-height:44px;padding:0 14px;margin:0;background:var(--card);color:var(--ink);border:1px solid var(--bd)}
.budget-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.budget-compare>div{padding:10px;border:1px solid var(--bd);border-radius:14px}
.budget-compare>div:last-child{background:var(--lav)}
.budget-compare strong{display:block}
.budget-quick{margin-top:6px}
.budget-result:focus-visible{outline-offset:4px}
.today-budget .budget-head{align-items:flex-start}
.today-budget .budget-head h2{font-size:15px;margin:8px 0 0}
.today-budget .budget-value{font-size:clamp(36px,11vw,54px);letter-spacing:-.05em;overflow-wrap:anywhere}
.budget-amount{margin:5px 0 14px}
.budget-amount p{font-weight:700}
.budget-indicator{--budget-color:var(--mt);background:var(--card);border:1px solid var(--bd);border-radius:14px}
.budget-indicator[data-status="at"]{--budget-color:var(--pri)}
.budget-indicator[data-status="over"]{--budget-color:var(--err)}

/* Dashboard design */
:root{--pri:#581C9C;--pri-hover:#702BC0;--ink:#26143F;--lav:#F0E5FF;--bg:#FAF8FF;--card:#FFF;--bd:#E8DAF5;--mut:#746487;--mw:#EAF7DD;--mt:#386B12;--err:#AD2849;--ew:#FCE7ED;--panel:#581C9C;--panel-end:#43247C}

.gauge-track::before{background:conic-gradient(from 270deg,var(--gauge-fill) 0deg var(--sweep),var(--gauge-track) var(--sweep) 180deg,transparent 180deg)}

.gauge-label{position:absolute;inset:auto 0 0;font-weight:800;font-size:clamp(14px,4.5vw,21px)}

@media(max-width:370px){.app.dashboard{padding-inline:14px}.week-actions{grid-template-columns:1fr}.action-tile{gap:5px;font-size:12px}.setting-grid{grid-template-columns:1fr}.setting-grid .action-tile{flex-direction:row;align-items:center;justify-content:flex-start;min-height:44px}}

function elig(P){const out=[],rej={},al=P.al.filter(a=>a!='none'&&a!='skip');
 ML.forEach(m=>{let r=0;if(m.lv>DL[P.diet])r='diet';else if(m.al.some(a=>al.includes(a)))r='allergen';else if(m.unk&&P.al.some(a=>a!='none'))r='unknown';else if(P.dl.some(x=>m.ing.includes(x)))r='dislike';r?rej[m.id]=r:out.push(m)});return{out,rej}}
function targets(P){const w=P.w||60,h=P.h||165,g=P.goal,ad=(P.age||20)>=18,t=Math.round((10*w+6.25*h-5*(P.age||20)-78)*(ACT[P.act]||1.375));
 if(ad&&g==='gain')return{tdee:t,kLo:t+200,kHi:t+500,pro:Math.round(w*.9)};
 const[pk,lo,hi]=g==='muscle'?[ad?1.6:1.2,.8,1.3]:ad&&g==='light'?[1,.7,.95]:[.9,.9,1.1];
 return{tdee:t,kLo:Math.max(ad&&g==='light'?1200:1100,Math.round(t*lo)),kHi:Math.round(t*hi),pro:Math.round(w*pk*.9)}}
function combos(p){const sn=[{m:[],rm:0,k:0,p:0}];p.s.forEach((x,i)=>{sn.push({m:[x],rm:x.rm,k:x.k,p:x.p});for(let j=i+1;j<p.s.length;j++){const y=p.s[j];sn.push({m:[x,y],rm:x.rm+y.rm,k:x.k+y.k,p:x.p+y.p})}});
 const o=[];for(const b of p.b)for(const l of p.ld)for(const d of p.ld){if(l==d)continue;for(const s of sn)o.push({m:[b,l,d,...s.m],rm:+(b.rm+l.rm+d.rm+s.rm).toFixed(2),k:b.k+l.k+d.k+s.k,p:b.p+l.p+d.p+s.p})}return o}
function analyse(P){const{out,rej}=elig(P),T=targets(P),p={b:out.filter(m=>m.c=='b'),ld:out.filter(m=>m.c=='ld'),s:out.filter(m=>m.c=='s')};
 if(!p.b.length||p.ld.length<2)return{out,rej,T,none:1,cs:[],good:[]};
 const cs=combos(p),good=cs.filter(c=>c.k>=T.kLo&&c.k<=T.kHi&&c.p>=T.pro),c5=x=>Math.ceil(x*2)/2,minAny=cs.reduce((a,c)=>Math.min(a,c.rm),99);
 const gs=[...good].sort((a,b)=>a.rm-b.rm),seen=new Set();let rec=null;for(const c of gs){c.m.forEach(m=>seen.add(m.id));if(seen.size>=12){rec=c.rm;break}}
 return{out,rej,T,cs,good,minAny,minGoal:gs.length?gs[0].rm:null,sg:gs.length?[c5(gs[0].rm),c5(rec??gs[gs.length-1].rm)]:null}}
const score=(c,T,b)=>Math.min(c.p/T.pro,1.15)*50+(1-Math.min(1,Math.abs(c.k-(T.kLo+T.kHi)/2)/T.kHi))*30+(b-c.rm)/b*10;
function build(P){const a=analyse(P);const rj={};Object.values(a.rej).forEach(r=>rj[r]=(rj[r]||0)+1);
 const tr={all:ML.length,ok:a.out.length,rej:rj,T:a.T,n:a.cs.length,minAny:a.minAny,minGoal:a.minGoal,sg:a.sg,fit:0};
 if(a.none)return{mode:'none',tr,why:'pool'};
 let pool=a.good.filter(c=>c.rm<=P.bud),mode='full';if(!pool.length){pool=a.cs.filter(c=>c.rm<=P.bud);mode='partial'}
 tr.fit=pool.length;if(!pool.length)return{mode:'none',tr,why:'budget'};
 const used={},days=[];for(let d=0;d<7;d++){let best,bs=-1e9;for(const c of pool){let s=score(c,a.T,P.bud);c.m.forEach(m=>s-=14*(used[m.id]||0));if(s>bs){bs=s;best=c}}
  best.m.forEach(m=>used[m.id]=(used[m.id]||0)+1);days.push(best.m.map(m=>m.id))}
 return{mode,days,tr,P:JSON.parse(JSON.stringify(P))}}
function val(s,P){const e={};

  if(!GOALS.some(([id])=>id===currentGoal(P.goal)))e.goal='Choose a goal.';
  else if(goalNeedsAdult(P.goal)&&P.age<18)e.goal='Weight change goals are for adults 18+. Pick another goal.';
  if(!P.gen)e.gen='Choose one option, or "Prefer not to say".';
 }

 if(s==2&&!P.al.length)e.al='Select “None” or your allergies.';
 if(s==3&&!P.diet)e.diet='Choose a dietary pattern.';
 if(s==4&&!(P.bud>0&&P.bud<=1000))e.bud='Enter a daily budget above RM 0.';return e}

function goalBudgetReason(budget,minimum){
 if(minimum==null)return 'None of the meal combinations that match your food settings meet both targets. Increasing the budget alone won’t fix this with the current food list.';
 if(minimum>budget)return 'The cheapest day in SiswaDiet that meets both targets and matches your food settings costs '+rm(minimum)+'. That’s '+rm(minimum-budget)+' more than your daily budget.';

}

const foodThumb=meal=>{
 const artwork=mealArtwork[meal.id==='bge'?'pl-telur-rebus':meal.id];
 if(artwork)return `<span class="meal-thumb" aria-hidden="true"><img src="${artwork}" alt="" width="111" height="103" loading="lazy" decoding="async"></span>`;
 const name=meal.n.toLowerCase();
 const symbol=[[/banana|pisang/,'🍌'],[/boiled egg|telur rebus/,'🥚'],[/sandwich|toast|wrap/,'🥪'],[/chickpea|tempeh|tofu/,'🫘'],[/roti|chapati/,'🫓'],[/noodle|mee|bihun/,'🍜'],[/rice|nasi/,'🍚'],[/milk|yogurt/,'🥛'],[/chicken|ayam/,'🍗'],[/oat/,'🥣'],[/fish|ikan/,'🐟']].find(([pattern])=>pattern.test(name))?.[1];
 return `<span class="meal-thumb" aria-hidden="true">${symbol||ic('bowl',22)}</span>`;
};
const budgetGauge=(percent,color)=>`<div class="budget-gauge" role="img" aria-label="${percent}% of budget" style="--sweep:${Math.min(100,Math.max(0,percent))*1.8}deg;--gauge-fill:${color}"><div class="gauge-track"></div><span class="gauge-label">${percent}%</span></div>`;
const mrow=(id,i,d,lg,logged=lg&&isLg(i,id))=>{const m=MB[id];return`<div class="ml meal-row"><button class="pl" data-a="meal" data-v="${id}" data-i="${i}" data-d="${d}">${foodThumb(m)}<div><div class="mut sm">${SL[i]}</div><b>${esc(m.n)}</b><div class="mut sm">${rm(m.rm)} · ${m.k} kcal · ${m.p} g protein</div></div></button><div class="g">${logged?`<span class="ok">${ic('ok',16)} Logged</span>`:lg?`<button class="btn bs" data-a="log" data-v="${id}" data-i="${i}" data-d="${d}">+ Log</button>`:''}<button class="lk" data-a="swap" data-i="${i}" data-d="${d}">${ic('swap',14)} Swap</button></div></div>`};
function nutritionTotals(logs){
 const totals={k:0,cb:0,f:0,p:0,unknown:0};
 for(const log of logs){
  const meal=log.nutrition||MB[log.id];
  if(!meal){totals.unknown++;continue}
  for(const key of ['k','cb','f','p'])totals[key]+=meal[key];
 }
 return totals;
}
let nutritionDay=0;
function nutritionCards(logs,P){
 const totals=nutritionTotals(logs), T=targets(P);
 const energy=Math.max(1,Math.round((T.kLo+T.kHi)/2));
 const remaining=energy-totals.k;
 const overAmount=(value,target)=>Math.round((value-target)*100)/100;
 const overLabel=(amount,unit,short=false)=>`<span class="nutrition-over-label">${amount<.1?'&lt;0.1':'+'+nutritionNumber(amount)} ${unit}${short?'':' over target'}</span>`;
 const meter=(name,value,target,unit,minimum=false)=>{
  const over=!minimum&&overAmount(value,target)>0;
  return `<progress class="nutrition-meter${over?' is-over':''}" aria-label="${name} ${minimum?'daily minimum':'daily target'}" aria-valuetext="${nutritionNumber(value)} of ${nutritionNumber(target)} ${unit}${over?', over target':''}" value="${Math.min(value,target)}" max="${target}"></progress>`;
 };
 const macro=(name,icon,value,target,minimum=false)=>{
  const over=overAmount(value,target);
  const proteinStatus=value>=target?(over>0?'+'+nutritionNumber(over)+' g above minimum':'Target met'):nutritionNumber(target-value)+' g to target';
  return `<div><div class="today-macro-title">${ic(icon,17)}<h3>${name}</h3></div>${meter(name,value,target,'g',minimum)}<b>${nutritionNumber(value)} g</b><span class="mut sm">/ ${target} g</span>${minimum?`<span class="nutrition-note-pill minimum" aria-label="${value>=target?'Target met. ':''}${proteinStatus}">${proteinStatus}</span>`:over>0?overLabel(over,'g',true):`<span class="nutrition-note-pill">${ic('ok',12)} Within target</span>`}</div>`;
 };
 return `<section aria-label="Nutrition logged ${nutritionDay?'yesterday':'today'}">
 <div class="card nutrition-card">
  <div class="nutrition-title"><div class="nutrition-main">${authIcon('flame',25)}<h2>Calories</h2></div><select id="today-nutrition-day" class="today-nutrition-day" aria-label="Day shown in nutrition summary"><option value="0"${nutritionDay?'':' selected'}>Today</option><option value="1"${nutritionDay?' selected':''}>Yesterday</option></select></div>
  <div class="nutrition-count"><span><strong>${nutritionNumber(totals.k)}</strong> <span class="mut sm">/ ${energy.toLocaleString('en-MY')} kcal</span></span>${overAmount(totals.k,energy)>0?overLabel(overAmount(totals.k,energy),'kcal'):nutritionDay?'':`<span class="mut sm">${nutritionNumber(Math.max(0,remaining))} kcal left</span>`}</div>
  ${meter('Calories',totals.k,energy,'kcal')}
 </div>
 <div class="card nutrition-card"><div class="nutrition-macros">
  ${macro('Carbs','grain',totals.cb,Math.max(1,Math.round(energy*.5/4)))}
  ${macro('Fat','drop',totals.f,Math.max(1,Math.round(energy*.3/9)))}
  ${macro('Protein','strength',totals.p,Math.max(1,T.pro),true)}
 </div><p class="mut sm nutrition-info">${ic('info',17)}<span>Estimated from meals logged ${nutritionDay?'yesterday':'today'}.${totals.unknown?' Custom meals without nutrition values are excluded.':''}</span></p></div>
 </section>`;
}

function todayBudgetCard(budget,planned,logs){
 const limit=Math.round(budget*100);
 const spent=logs.reduce((total,log)=>total+Math.round(log.rm*100),0);
 const left=limit-spent;
 const status=left<0?'over':left===0?'at':'under';
 const statusLabel={under:'Under budget',at:'Budget reached',over:'Over budget'}[status];

 const percent=usage>100&&usage<101?'Over 100':usage<100&&usage>99?'Over 99':String(Math.round(usage));

function mealStats(ids){

  result.cents+=Math.round(meal.rm*100);result.k+=meal.k;result.p+=meal.p;

function goalGap(stats,T){

 if(others.includes(meal.id))reasons.push('This food is already in another slot on this day.');

function weeklyReview(logs,now=new Date()){

  const dayLogs=logs.filter(log=>log.d===date.key);

  const logged=dayLogs.reduce((sum,log)=>sum+Math.round(log.rm*100),0);
  const planned=mealStats(S.plan.days[date.day]).cents;
  complete.push({...date,logged,planned});
 }
 const over=complete.filter(item=>item.logged>budget);
 const advice=[];
 if(complete.length>=3&&over.length>=2){
  const seen=new Set();
  for(const {day} of over){
   for(const [i,id] of S.plan.days[day].entries()){
    const current=MB[id], base=mealStats(S.plan.days[day]).cents;

    }
   }
  }
 }

}

async function prepareScanPhoto(file){
 if(!file.type.startsWith('image/')||file.size>18000000)throw Error('Choose an image under 18 MB.');
 const url=URL.createObjectURL(file);
 try{
  const image=new Image();
  image.src=url;
  try{await image.decode()}catch{throw Error('This photo format could not be opened. Try a JPEG or take a new photo.')}
  const ratio=Math.min(1,960/Math.max(image.width,image.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.78));
  if(!blob||blob.size>750000)throw Error('This photo is too large. Try cropping to the plate.');
  return blob;
 }finally{URL.revokeObjectURL(url)}
}
async function selectScanPhoto(scan,file){

 scan.busy=true;scan.message='Preparing photo…';scan.photo=null;scan.preview='';scan.items=null;R();
 try{
  scan.photo=await prepareScanPhoto(file);
  scan.preview=await new Promise((resolve,reject)=>{
   const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Could not preview that photo.'));reader.readAsDataURL(scan.photo);
  });
  scan.message='';
 }catch(error){scan.message=error.message}
 finally{scan.busy=false;if(sheet===scan)R()}
}
async function analyzeScan(scan){
 if(!scanConfigured()||!U||!scan.photo||scan.busy)return;
 scan.busy=true;scan.message='';R();
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),65000);
 try{
  const token=await U.getIdToken();
  if(sheet!==scan)return;
  const response=await fetch(SCAN_ENDPOINT,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'image/jpeg'},body:scan.photo,signal:controller.signal});
  if(response.status===400||response.status===415)throw Error('The scanner could not read that photo. Try a new JPEG.');
  if(response.status===401)throw Error('Please sign out and sign back in to refresh your session.');
  if(response.status===403)throw Error('Scanning requires a saved SiswaDiet profile with an age of 18 or older. If you just saved your profile, wait a moment and retry.');
  if(response.status===429)throw Error('Scan limit reached. Try later or choose foods manually.');
  if(response.status===503)throw Error('The scanner could not check your profile or is unavailable. Try again or choose foods manually.');
  if(response.status===504)throw Error('Gemini took too long to respond. Try again or choose foods manually.');
  if(!response.ok)throw Error('Could not analyze the photo. Try again or choose foods manually.');
  const result=await response.json();
  if(!Array.isArray(result.ids))throw Error('No scan result was available.');
  const eligible=new Set(scanMeals().map(food=>food.id));
  const ids=[...new Set(result.ids)].filter(id=>eligible.has(id)).slice(0,8);
  scan.items=ids.length?ids.map(id=>({id,servings:1})):[emptyScanItem()];
  scan.message=ids.length?'Check the suggestions, add any missed food, and adjust the servings.':'No matching foods passed your filters. Choose foods manually.';
 }catch(error){
  if(controller.signal.aborted||error.name==='TimeoutError'||error.name==='AbortError'){
   scan.message='The scan took too long or the connection was interrupted. Try again with the app open, or choose foods manually.';
  }else if(error instanceof TypeError){
   scan.message='Could not reach the scanner. Check your connection and try again, or choose foods manually.';
  }else{scan.message=error.message}
  scan.items??=[emptyScanItem()];
 }
 finally{clearTimeout(timeout);scan.busy=false;if(sheet===scan)R()}
}
function saveScan(scan){

  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),10000);
  try{
   const response=await fetch(url,{cache:'no-store',redirect:'error',signal:controller.signal});
   if(!response.ok)return{status:'error'};
   const page=new DOMParser().parseFromString(await response.text(),'text/html');
   const build=readBuild(page);
   const publishedFirebase=firebaseIdentity(page);
   if(!Number.isSafeInteger(build)||build<1||!runningFirebase||!publishedFirebase||
      publishedFirebase.projectId!==runningFirebase.projectId||publishedFirebase.appId!==runningFirebase.appId)return{status:'blocked'};
   if(build<runningBuild)return{status:'stale'};
   return build>runningBuild?{status:'new',url:url.href,build}:{status:'same'};
  }catch(error){return{status:'error'}}finally{clearTimeout(timer)}
}
function probeUpdate(){
 if(pendingCheck)return pendingCheck;
 pendingCheck=(async()=>{
  const results=await Promise.all((alternate?[entry,alternate]:[entry]).map(probePage));
  const newer=results.filter(result=>result.status==='new').sort((a,b)=>b.build-a.build)[0];
  if(newer)return newer;
  for(const status of ['same','stale','blocked'])if(results.some(result=>result.status===status))return{status};
  return{status:'error'};
 })().finally(()=>{pendingCheck=null});
 return pendingCheck;
}
window.checkUpdate=async(manual=false)=>{
 const update=await probeUpdate();
 if(update.status!=='new')return update.status;
 if(update.build===dismissedBuild)return 'dismissed';
 if(!applyingUpdate&&(manual||update.build!==failedBuild)){
  visibleBuild=update.build;
  updateSlot.hidden=false;
 }
 return 'new';
};
checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});setInterval(checkUpdate,120000);
</script>
